{% extends 'base.html' %}
{% block title %}Delete Record{% endblock %}
{% block page_title %}Delete Attendance Record{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger">
  <div class="card-header bg-danger text-white"><i class="bi bi-trash me-2"></i>Confirm Delete</div>
  <div class="card-body">
    <p>Delete attendance record for <strong>{{ record.employee.name }}</strong> on <strong>{{ record.date }}</strong>?</p>
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'attendance_list' %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
