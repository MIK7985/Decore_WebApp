{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete – Decore Developers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #10b981; --primary-light: #34d399; --bg-light: #f8fafc; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-light); }
    .login-card { background: rgba(255, 255, 255, 0.75); border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.12); border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(24px); max-width: 420px; width: 100%; padding: 3rem 2rem; text-align: center; }
    .btn-login { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none; border-radius: 12px; padding: .85rem; font-weight: 600; font-size: 1rem; width: 100%; color: #fff; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <div class="login-card">
        <i class="bi bi-check-circle text-primary mb-3" style="font-size: 4rem;"></i>
        <h2 class="fw-800 text-dark mb-2">Password Reset Complete</h2>
        <p class="text-muted fw-500 mb-4">Your password has been set. You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn btn-login">Log in</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
