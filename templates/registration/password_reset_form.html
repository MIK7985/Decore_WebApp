{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Decore Developers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10b981;
      --primary-light: #34d399;
      --bg-light: #f8fafc;
    }
    body { 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      background: var(--bg-light);
      position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.12), transparent 45%), radial-gradient(circle at 85% 30%, rgba(52, 211, 153, 0.12), transparent 45%);
      z-index: -1; pointer-events: none;
    }
    .login-card { 
      background: rgba(255, 255, 255, 0.75); 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.12); 
      border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      overflow: hidden; max-width: 420px; width: 100%;
    }
    .login-header { padding: 3rem 2rem 1.5rem; text-align: center; }
    .login-header h2 { color: #0f172a; font-weight: 800; margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
    .login-header p { color: #64748b; margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .login-body { padding: 0 2rem 2.5rem; }
    .form-label { font-weight: 600; font-size: .8rem; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .form-control { border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); padding: .75rem 1rem; font-size: .95rem; font-weight: 500; background: rgba(255,255,255,0.8); transition: all 0.3s; outline: none; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); background: #fff;}
    .btn-login { 
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
      border: none; border-radius: 12px; padding: .85rem; font-weight: 600; font-size: 1rem; width: 100%; color: #fff; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); margin-top: 0.5rem; 
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45); color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <div class="login-card">
        <div class="login-header">
          <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
          <h2 class="mt-3">Reset Password</h2>
          <p>Enter your email address and we will send you a link to reset your password.</p>
        </div>
        <div class="login-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
            </div>
            <button type="submit" class="btn btn-login">Send Reset Link</button>
          </form>
          <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="small fw-600 text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
