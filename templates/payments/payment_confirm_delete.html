{% extends 'base.html' %}
{% block title %}Delete Payment{% endblock %}
{% block page_title %}Delete Payment{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger">
  <div class="card-header bg-danger text-white"><i class="bi bi-trash me-2"></i>Confirm Delete</div>
  <div class="card-body">
    <p>Delete payment record of <strong>₹{{ payment.paid_amount }}</strong> for <strong>{{ payment.employee.name }}</strong>?</p>
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'payment_list' %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
