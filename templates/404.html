{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}Error 404{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm text-center py-5">
    <div class="card-body">
        <div class="display-1 fw-900 text-primary mb-4">404</div>
        <h2 class="fw-800 mb-3">Oops! Page not found</h2>
        <p class="text-muted mb-4 fs-5">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg px-5">
            <i class="bi bi-house-door me-2"></i>Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
