{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Decore Developers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'img/Logo-removebg-preview (1).png' %}">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if(savedTheme === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark');
    
    // Smart Redirect: If user is already logged in, whisk them to the dashboard immediately
    {% if user.is_authenticated %}
      window.location.href = "{% url 'dashboard' %}";
    {% endif %}

    // Robust FOUC prevention for translation
    if (document.cookie.indexOf('googtrans=/en/ml') !== -1) {
      document.write('<style id="translate-fouc">body { opacity: 0 !important; visibility: hidden !important; }</style>');
      
      const observer = new MutationObserver((mutations, obs) => {
        if (document.documentElement.classList.contains('translated-ltr')) {
          const style = document.getElementById('translate-fouc');
          if (style) style.remove();
          obs.disconnect();
        }
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      
      // Fallback
      setTimeout(() => {
        const style = document.getElementById('translate-fouc');
        if (style) style.remove();
      }, 2500);
    }
  </script>
  <style>

    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --accent: #ec4899;
      --bg-light: #f8fafc;
    }
    body { 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      background: var(--bg-light);
      position: relative;
      overflow-x: hidden;
      padding: 1rem;
    }
    /* Dynamic background graphic */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: 
        radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.12), transparent 45%), 
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.12), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.08), transparent 45%);
      z-index: -1; pointer-events: none;
    }
    .login-card { 
      background: rgba(255, 255, 255, 0.75); 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -10px rgba(31, 38, 135, 0.12); 
      border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      overflow: hidden; 
      max-width: 420px; width: 100%;
      animation: slideUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
      opacity: 0; transform: translateY(20px);
      position: relative;
    }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    
    .login-header { padding: 3rem 2rem 1.5rem; text-align: center; }
    .login-logo { 
      height: 85px; 
      display: flex; align-items: center; justify-content: center; 
      margin: 0 auto 1rem;
    }
    .login-logo img {
      max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15));
    }
    .login-header h2 { color: #0f172a; font-weight: 800; margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
    .login-header p { color: #64748b; margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .login-body { padding: 0 2rem 2.5rem; }
    .form-label { font-weight: 600; font-size: .8rem; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .form-control { border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); padding: .75rem 1rem; font-size: .95rem; font-weight: 500; background: rgba(255,255,255,0.8); transition: all 0.3s; outline: none; }
    .input-group-text { border-radius: 12px 0 0 12px; background: rgba(248, 250, 252, 0.5); border: 1px solid rgba(0,0,0,0.1); border-right: none; color: #94a3b8; transition: all 0.3s; }
    .form-control.has-icon { border-radius: 0 12px 12px 0; border-left: none; }
    .form-control.has-icon.middle { border-radius: 0; border-right: none; }
    .btn-toggle-password { border-radius: 0 12px 12px 0; border: 1px solid rgba(0,0,0,0.1); border-left: none; background: rgba(255,255,255,0.8); color: #94a3b8; transition: all 0.3s; }
    .input-group:focus-within .btn-toggle-password { border-color: var(--primary); background: #fff; color: var(--primary); }
    
    .input-group { border-radius: 12px; transition: all 0.3s; }
    .input-group:focus-within { box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }
    .input-group:focus-within .form-control { border-color: var(--primary); background: #fff; }
    .input-group:focus-within .input-group-text { border-color: var(--primary); color: var(--primary); background: #fff; }
    .btn-login { 
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
      border: none; border-radius: 12px; padding: .85rem; font-weight: 600; font-size: 1rem; width: 100%; color: #fff; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3); margin-top: 0.5rem; 
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45); color: #fff; }

    /* Dark Mode Overrides */
    [data-bs-theme="dark"] {
      --bg-light: #0f172a;
    }
    [data-bs-theme="dark"] .login-card {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    }
    [data-bs-theme="dark"] .login-header h2 { color: #f8fafc; }
    [data-bs-theme="dark"] .form-label { color: #94a3b8; }
    [data-bs-theme="dark"] .form-control { background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1); color: #f8fafc; }
    [data-bs-theme="dark"] .input-group-text, [data-bs-theme="dark"] .btn-toggle-password { background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.1); color: #94a3b8; }
    [data-bs-theme="dark"] .form-control:focus, [data-bs-theme="dark"] .input-group:focus-within .form-control { background: #1e293b; color: #f8fafc; }
    [data-bs-theme="dark"] .input-group:focus-within .input-group-text, [data-bs-theme="dark"] .input-group:focus-within .btn-toggle-password { background: #1e293b; }
    
    .theme-toggle { position: absolute; top: 1.25rem; right: 1.25rem; z-index: 100; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); color: var(--text-main); cursor: pointer; transition: all 0.3s; }
    .theme-toggle:hover { background: rgba(0,0,0,0.1); transform: scale(1.05); }
    [data-bs-theme="dark"] .theme-toggle { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); color: #f8fafc; }
    [data-bs-theme="dark"] .theme-toggle:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
      <div class="login-card">
        <div class="dropdown" style="position: absolute; top: 1.25rem; left: 1.25rem; z-index: 100;">
          <button class="theme-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="position: relative; top: 0; left: 0; right: auto;" aria-label="Select Language">
            <i class="bi bi-translate fs-5"></i>
          </button>
          <ul class="dropdown-menu shadow border-0" style="border-radius: 12px; min-width: 150px;">
            <li><a class="dropdown-item fw-500 py-2" href="#" onclick="setLanguage('ml'); return false;">മലയാളം (Malayalam)</a></li>
            <li><a class="dropdown-item fw-500 py-2" href="#" onclick="setLanguage('en'); return false;">English</a></li>
          </ul>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Dark Mode">
          <i class="bi bi-moon-stars fs-5"></i>
        </button>
        <div class="login-header">
          <div class="login-logo"><img src="{% static 'img/Logo.png' %}" alt="Decore Developers" class="notranslate"></div>
          <h2 class="notranslate">Decore Developers</h2>
          <p>POP Work Management System</p>

        </div>
        <div class="login-body">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2" role="alert">
            {{ message }}<button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
          </div>
          {% endfor %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Employee ID or Phone</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" class="form-control has-icon" placeholder="e.g. DC001 or Phone number" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0">Password</label>
                <a href="#" onclick="alert('Please contact your administrator to reset your password.'); return false;" class="small text-decoration-none fw-600 text-primary">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" id="password" class="form-control has-icon middle" placeholder="Enter password" required>
                <button type="button" class="btn btn-toggle-password" id="togglePassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-login">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <div class="text-center mt-3">
            <small class="text-muted">Kerala POP Works • Attendance & Salary Management</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const togglePassword = document.querySelector('#togglePassword');
  const password = document.querySelector('#password');
  const eyeIcon = togglePassword.querySelector('i');

  togglePassword.addEventListener('click', function (e) {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    
    if (type === 'password') {
      eyeIcon.classList.remove('bi-eye-slash');
      eyeIcon.classList.add('bi-eye');
    } else {
      eyeIcon.classList.remove('bi-eye');
      eyeIcon.classList.add('bi-eye-slash');
    }
  });

  // Theme Toggle Logic
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  if (themeToggleBtn) {
    const updateBtnIcon = () => {
      const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      themeToggleBtn.innerHTML = isDark 
        ? '<i class="bi bi-sun text-warning fs-5"></i>'
        : '<i class="bi bi-moon-stars text-secondary fs-5"></i>';
    };
    updateBtnIcon();
    
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateBtnIcon();
    });
  }
</script>

<!-- Language Translation Script -->
<style>
  .skiptranslate iframe { display: none !important; }
  body { top: 0 !important; }
  #google_translate_element { display: none !important; }
  .goog-te-banner-frame.skiptranslate { display: none !important; } 
</style>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,ml', autoDisplay: false}, 'google_translate_element');
  }
  function setLanguage(lang) {
    var domain = window.location.hostname;
    document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + domain;
    document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + domain;
    if (lang !== 'en') {
      document.cookie = `googtrans=/en/${lang}; path=/; domain=${domain}`;
      document.cookie = `googtrans=/en/${lang}; path=/`; 
      document.cookie = `googtrans=/en/${lang}; path=/; domain=.${domain}`; 
    }
    window.location.reload();
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
