{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="mb-4 text-danger">
          <i class="bi bi-exclamation-triangle fs-1"></i>
        </div>
        
        <h4 class="fw-bold mb-3">{{ title }}</h4>
        <p class="text-muted mb-4 fs-6">{{ message }}</p>
        
        <form method="POST">
          {% csrf_token %}
          <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a href="{% url cancel_url %}" class="btn btn-light px-4 py-2 border fw-500">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 py-2 fw-bold shadow-sm">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
