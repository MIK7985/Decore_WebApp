{% extends 'base.html' %}
{% block title %}Remove Assignment{% endblock %}
{% block page_title %}Remove Assignment{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger">
  <div class="card-header bg-danger text-white"><i class="bi bi-person-x me-2"></i>Remove Assignment</div>
  <div class="card-body">
    <p>Remove <strong>{{ assignment.employee.name }}</strong> from <strong>{{ assignment.site.name }}</strong>?</p>
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Remove</button>
      <a href="{% url 'site_detail' assignment.site.pk %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
