{% extends 'base.html' %}
{% block title %}Complete Site{% endblock %}
{% block page_title %}Mark Site as Completed{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-warning">
  <div class="card-header bg-warning text-dark"><i class="bi bi-archive me-2"></i>Confirm Completion</div>
  <div class="card-body">
    <p>Mark <strong>{{ site.name }}</strong> as <em>Completed</em>?</p>
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button type="submit" class="btn btn-warning">Yes, Complete</button>
      <a href="{% url 'site_detail' site.pk %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
