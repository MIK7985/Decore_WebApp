{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block page_title %}Error 500{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm text-center py-5">
    <div class="card-body">
        <div class="display-1 fw-900 text-danger mb-4">500</div>
        <h2 class="fw-800 mb-3">Something went wrong</h2>
        <p class="text-muted mb-4 fs-5">Our server encountered an internal error. We've been notified and are working on it.</p>
        <div class="d-flex gap-2 justify-content-center">
            <button onclick="location.reload()" class="btn btn-outline-primary px-4">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-2"></i>Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
